name: Order Total CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  order-total:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run order total calculation
        run: python ordering.py
      - name: Run cart demo
        run: python cart.py
      - name: Run unit tests
        run: |
          pip install pytest
          pytest tests/test_order_total.py -v

  docker-selenium:
    runs-on: ubuntu-latest
    needs: order-total
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and run Docker container
        run: |
          docker build -t food-ordering-app .
          docker run -d --name food-app -p 5000:5000 food-ordering-app
      - name: Wait for app
        run: |
          for i in $(seq 1 20); do curl -sf http://localhost:5000/health && exit 0; sleep 1; done
          docker logs food-app; exit 1
      - name: Run Selenium login tests
        run: |
          pip install pytest selenium
          pytest tests/test_login_selenium.py -v
