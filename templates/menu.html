<!DOCTYPE html>
<html>
<head><title>Food Order - Menu</title></head>
<body>
  <h1 id="welcome">Welcome, {{ user }}</h1>
  <p><a id="cart-link" href="{{ url_for('view_cart') }}">Cart ({{ cart_count }})</a> |
     <a href="{{ url_for('logout') }}">Logout</a></p>
  {% for msg in get_flashed_messages() %}<p class="flash">{{ msg }}</p>{% endfor %}
  <table>
    <tr><th>Item</th><th>Price</th><th>Add</th></tr>
    {% for item, price in menu.items() %}
    <tr>
      <td>{{ item }}</td>
      <td>Rs {{ price }}</td>
      <td>
        <form method="post" action="{{ url_for('add_to_cart') }}">
          <input type="hidden" name="item" value="{{ item }}">
          <input id="qty-{{ item }}" name="qty" type="number" min="1" value="1" style="width:4em">
          <button id="add-{{ item }}" type="submit">Add to cart</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
